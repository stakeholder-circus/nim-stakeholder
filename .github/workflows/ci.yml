name: ci-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.2.8
      - name: Format check
        shell: bash
        run: |
          nimpretty src/stakeholder.nim src/stakeholder_runtime.nim tests/test_stakeholder.nim
          git diff --exit-code
      - name: Semantic checks
        shell: bash
        run: |
          nim check src/stakeholder.nim
          nim check --path:src tests/test_stakeholder.nim
      - name: Build
        run: nimble build -y
      - name: Test
        run: nimble test -y
