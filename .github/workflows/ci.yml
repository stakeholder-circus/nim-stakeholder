name: ci-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jiro4989/setup-nim-action@cb1fc1270b117457dd0d9f610ec981fad3369cec # v2
        with:
          nim-version: 2.2.8
      - name: Format check
        shell: bash
        run: |
          nimpretty src/stakeholder.nim src/stakeholder_runtime.nim tests/test_stakeholder.nim
          git diff --exit-code
      - name: Semantic checks
        shell: bash
        run: |
          nim check src/stakeholder.nim
          nim check --path:src tests/test_stakeholder.nim
      - name: Build
        run: nimble build -y
      - name: Test
        run: nimble test -y
